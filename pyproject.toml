[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nismo"
dynamic = ["version"]
description = "Morph-assisted nested importance sampling for Bayesian inference"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "NISMO contributors" },
]
keywords = [
  "Bayesian inference",
  "evidence",
  "nested sampling",
  "importance sampling",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
morph = [
  "morphZ>=0.4.1",
]
plot = [
  "matplotlib>=3.7",
]
progress = [
  "tqdm>=4.66",
]
all = [
  "matplotlib>=3.7",
  "morphZ>=0.4.1",
  "tqdm>=4.66",
]
dev = [
  "build>=1.2",
  "matplotlib>=3.7",
  "morphZ>=0.4.1",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "tqdm>=4.66",
  "twine>=5",
]
ligo = [
    "bilby>=2.8.2",
    "gwpy>=3.0.14",
    "lalsuite>=7.26.15",
  "pandas>=2.2",
]

[project.urls]
Changelog = "https://github.com/nz-gravity/nismo/blob/main/CHANGELOG.md"
Documentation = "https://github.com/nz-gravity/nismo/blob/main/docs/index.md"
Issues = "https://github.com/nz-gravity/nismo/issues"
Repository = "https://github.com/nz-gravity/nismo"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nismo = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "nismo._version.__version__" }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
  "unit: deterministic unit tests",
  "integration: package and component integration tests",
  "statistical: stochastic accuracy tests",
  "slow: tests excluded from the fast development loop",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]
extend-exclude = [
  "analysis/**",
  "examples/*.ipynb",
  "examples/g_shell.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
packages = ["nismo"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["morphZ", "morphZ.*", "scipy", "scipy.*", "tqdm", "tqdm.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["nismo"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "dynesty>=3.1.0",
]
lvk = [
  "bilby>=2.8.2",
  "dynesty>=3.1.0",
  "gwpy>=3.0.14",
  "lalsuite>=7.26.15",
  "matplotlib>=3.7",
  "morphZ>=0.4.1",
  "pandas>=2.2",
  "tqdm>=4.66",
]
